name: kora-fast-devnet

networks:
  kora-net:
    driver: bridge

volumes:
  data_node0:
  data_node1:
  data_node2:
  shared_config:

x-node-common: &node-common
  image: kora:local
  networks:
    - kora-net
  environment:
    - RUST_LOG=${RUST_LOG:-info}
    - CHAIN_ID=${CHAIN_ID:-1337}

x-validator-common: &validator-common
  <<: *node-common
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "/scripts/healthcheck.sh"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 30s
  environment:
    - RUST_LOG=${RUST_LOG:-info}
    - CHAIN_ID=${CHAIN_ID:-1337}
    - BLOCK_TIME_MS=${BLOCK_TIME_MS:-50}
    - GAS_LIMIT=${GAS_LIMIT:-250000000}
    - HEALTHCHECK_MODE=ready
    - HDC_ENABLED=true
    - CONFIG_FILE=/shared/kora.toml

services:
  # Setup + trusted dealer DKG for 3 validators
  init-config:
    <<: *node-common
    user: root
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "[init] Running keygen setup (3 validators, threshold 2)..." && \
        /usr/local/bin/keygen setup \
          --validators=3 \
          --threshold=2 \
          --chain-id=${CHAIN_ID:-1337} \
          --output-dir=/shared && \
        echo "[init] Running trusted dealer DKG..." && \
        /usr/local/bin/keygen dkg-deal \
          --validators=3 \
          --threshold=2 \
          --output-dir=/shared && \
        echo "[init] Generating kora.toml config..." && \
        printf 'chain_id = %s\ndata_dir = "/data"\n\n[execution]\ngas_limit = %s\nblock_time_ms = %s\n\n[hdc]\nenabled = %s\n\n[rpc]\nhttp_addr = "0.0.0.0:8545"\n' \
          "${CHAIN_ID:-1337}" "${GAS_LIMIT:-250000000}" "${BLOCK_TIME_MS:-50}" "${HDC_ENABLED:-true}" \
          > /shared/kora.toml && \
        echo "[init] Setting permissions..." && \
        chown -R 1000:1000 /shared/node0 /shared/node1 /shared/node2 && \
        echo "[init] Init complete"
    volumes:
      - shared_config:/shared
      - data_node0:/shared/node0
      - data_node1:/shared/node1
      - data_node2:/shared/node2

  validator-node0:
    <<: *validator-common
    hostname: node0
    entrypoint: ["/scripts/entrypoint.sh", "validator"]
    volumes:
      - shared_config:/shared:ro
      - data_node0:/data
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - CHAIN_ID=${CHAIN_ID:-1337}
      - BLOCK_TIME_MS=${BLOCK_TIME_MS:-50}
      - GAS_LIMIT=${GAS_LIMIT:-250000000}
      - VALIDATOR_INDEX=0
      - IS_BOOTSTRAP=true
      - HEALTHCHECK_MODE=ready
      - HDC_ENABLED=true
    ports:
      - "30400:30303"
      - "8545:8545"
      - "9000:9002"

  validator-node1:
    <<: *validator-common
    hostname: node1
    depends_on:
      validator-node0:
        condition: service_healthy
    entrypoint: ["/scripts/entrypoint.sh", "validator"]
    volumes:
      - shared_config:/shared:ro
      - data_node1:/data
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - CHAIN_ID=${CHAIN_ID:-1337}
      - BLOCK_TIME_MS=${BLOCK_TIME_MS:-50}
      - GAS_LIMIT=${GAS_LIMIT:-250000000}
      - VALIDATOR_INDEX=1
      - IS_BOOTSTRAP=false
      - BOOTSTRAP_PEERS=node0:30303
      - HEALTHCHECK_MODE=ready
      - HDC_ENABLED=true
    ports:
      - "30401:30303"
      - "8546:8545"
      - "9001:9002"

  validator-node2:
    <<: *validator-common
    hostname: node2
    depends_on:
      validator-node0:
        condition: service_healthy
    entrypoint: ["/scripts/entrypoint.sh", "validator"]
    volumes:
      - shared_config:/shared:ro
      - data_node2:/data
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - CHAIN_ID=${CHAIN_ID:-1337}
      - BLOCK_TIME_MS=${BLOCK_TIME_MS:-50}
      - GAS_LIMIT=${GAS_LIMIT:-250000000}
      - VALIDATOR_INDEX=2
      - IS_BOOTSTRAP=false
      - BOOTSTRAP_PEERS=node0:30303
      - HEALTHCHECK_MODE=ready
      - HDC_ENABLED=true
    ports:
      - "30402:30303"
      - "8547:8545"
      - "9002:9002"
