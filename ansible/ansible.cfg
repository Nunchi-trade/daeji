[defaults]
inventory = inventory/hosts.yml
# NOTE: roles_path is relative to the working directory, not to this file.
# Ansible must always be run from the ansible/ directory:
#   cd ansible && ansible-playbook playbooks/deploy.yml -i inventory/hosts.yml
# Running from the project root will fail with "role not found" errors.
roles_path = roles
# Disabled for first-time provisioning of fresh servers. Re-enable or use
# ANSIBLE_HOST_KEY_CHECKING=True once host keys are trusted.
host_key_checking = False
timeout = 30
stdout_callback = default
result_format = yaml

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
