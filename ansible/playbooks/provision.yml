---
# One-time server provisioning: install system deps, firewall, Docker
- name: Provision devnet server
  hosts: devnet
  become: true
  pre_tasks:
    - name: Validate trusted_ips is not wide open
      ansible.builtin.fail:
        msg: >
          trusted_ips contains 0.0.0.0/0, which allows all internet traffic to
          RPC/metrics/Grafana. Override in host_vars with specific CIDRs.
      when: "'0.0.0.0/0' in (trusted_ips | default([]))"

  roles:
    - role: base
      tags: [base]
    - role: firewall
      tags: [firewall]
    - role: docker
      tags: [docker]
