[package]
name = "symphony-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Multi-agent symphony chat agent. Uses commonware-p2p (same library as the kora chat layer) for real cross-process AEAD-encrypted messaging. Demonstrates 'agents talking in a chat' end-to-end."

[lints]
workspace = true

[dependencies]
# commonware (workspace deps — same as daeji-chat)
commonware-codec.workspace = true
commonware-cryptography.workspace = true
commonware-macros.workspace = true
commonware-p2p.workspace = true
commonware-runtime.workspace = true
commonware-utils.workspace = true

# Chain integration: WS subscription + signed tx submission.
alloy = { version = "2.0.4", features = ["full", "providers", "rpc-types-eth", "sol-types", "contract", "network", "signer-local"] }

# daeji-chat for room.rs helpers + RoomMessage type (so the wire format is
# identical to what kora's chat layer speaks).
daeji-chat = { path = "../daeji-chat" }

# core async + serde + tracing (workspace deps)
futures.workspace = true
hex.workspace = true
rand.workspace = true
rand_core.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# CLI + error
clap = { version = "4.5", features = ["derive", "env"] }
eyre.workspace = true

[[bin]]
name = "symphony-agent"
path = "src/main.rs"
