# Vendored verbatim from commonwarexyz/monorepo@v2026.4.0 examples/chat.
# Source:   https://github.com/commonwarexyz/monorepo/tree/v2026.4.0/examples/chat
# Upstream: tag v2026.4.0, commit 3c4e02ceede03126f524216605a1195e1cee7d0e
#
# Source files (src/main.rs, src/handler.rs, src/logger.rs, README.md, .gitignore)
# are BYTE-IDENTICAL to upstream. DO NOT EDIT them. See README.md for sync policy.
#
# This Cargo.toml is the only file with allowed modifications:
#   - Crate renamed to `commonware-chat-upstream` to avoid clashing with the
#     published `commonware-chat` crate on crates.io.
#   - `*.workspace = true` resolved to concrete values from upstream's
#     workspace Cargo.toml so this crate builds standalone inside daeji's
#     workspace (which uses different versions/edition).
#   - `[lints]` mirrors upstream rather than inheriting daeji's stricter ones.

[package]
name = "commonware-chat-upstream"
version = "2026.4.0"
edition = "2021"
rust-version = "1.91.1"
license = "MIT OR Apache-2.0"
description = "Send encrypted messages to a group of friends using commonware-cryptography and commonware-p2p."
readme = "README.md"
homepage = "https://commonware.xyz"
repository = "https://github.com/commonwarexyz/monorepo/tree/v2026.4.0/examples/chat"
documentation = "https://docs.rs/commonware-chat"
publish = false

[lints.rust]
unused-must-use = "deny"
rust-2018-idioms = "deny"

[dependencies]
chrono = "0.4.39"
clap = "4.5.18"
commonware-cryptography = { version = "2026.4.0", default-features = false }
commonware-macros = { version = "2026.4.0", default-features = false }
commonware-p2p = "2026.4.0"
commonware-runtime = "2026.4.0"
commonware-utils = { version = "2026.4.0", default-features = false }
crossterm = "0.29.0"
futures = "0.3.31"
prometheus-client = "0.24.0"
ratatui = "0.29.0"
serde_json = "1.0.122"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "json"] }

[[bin]]
name = "commonware-chat"
path = "src/main.rs"
bench = false
