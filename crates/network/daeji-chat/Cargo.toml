[package]
name = "daeji-chat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Symphony-class agent-coordination protocol primitives — AEAD room derivation, typed messages, on-chain identity binding. Bolted into the kora chain binary, not run as a separate process."

[lints]
workspace = true

[dependencies]
# commonware (workspace deps) — protocol primitives need ed25519 keys + codec + ordered set
commonware-codec.workspace = true
commonware-cryptography.workspace = true
commonware-utils.workspace = true

# serde + crypto + utils (workspace deps)
hex.workspace = true
rand.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha3.workspace = true
thiserror.workspace = true

# crypto (local deps — not in workspace)
chacha20poly1305 = "0.10.1"
base64 = "0.22"
